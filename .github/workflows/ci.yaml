---

name: Build and publish Docker image

on:
  push:
    branches:
      - trunk
  pull_request:
  workflow_dispatch:

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        python_version:
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4

      - name: Determine the branch suffix, if any
        run: |
          echo "DOCKER_BRANCH_SUFFIX=-${GITHUB_HEAD_REF}" >> $GITHUB_ENV
        if: ${{ github.event_name == 'pull_request' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to the container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and (maybe) publish image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            PYTHON_VERSION=${{matrix.python_version}}
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/zapgram/pilot-cimg-python-playwright:${{matrix.python_version}}${{env.DOCKER_BRANCH_SUFFIX}}
          push: ${{ github.ref_name == 'trunk' || env.DOCKER_BRANCH_SUFFIX != '' }}
